onboarding = false
# Minimal herdr config, mapped from tmux muscle memory (~/.tmux.conf)
# Workspaces (spaces) are used like tmux windows; tabs are mostly unused.

[keys]
prefix = "ctrl+a"

goto = ""
detach = "prefix+d"
workspace_picker = "prefix+w"
# Worktrees are opened through prefix+f (herdr-sessionizer), prefix+g and
# prefix+shift+g (gwt), see [[keys.command]] below. Disable herdr's native
# worktree actions.
open_worktree = ""
new_worktree = ""
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
new_workspace = ""
previous_workspace = "ctrl+left"
next_workspace = "ctrl+right"
previous_agent = "ctrl+up"
next_agent = "ctrl+down"
close_pane = "prefix+x"
close_workspace = "prefix+shift+q"
last_pane = "prefix+."

new_tab = "prefix+c"
previous_tab = "ctrl+["
next_tab = "ctrl+]"
close_tab = "prefix+shift+x"
# prefix+shift+t is the TODO list (see [[keys.command]] below); tabs are named
# by ~/bin/herdr-tab-autoname anyway.
rename_tab = ""

split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

switch_workspace = "" 
switch_tab = "ctrl+1..9"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "~/bin/herdr-sessionizer"
description = "sessionizer (repos + worktrees, most recently opened first)"

[[keys.command]]
key = "prefix+v"
type = "shell"
command = "~/bin/herdr-nvim"
description = "nvim (focus this space's editor, else new tab)"

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "~/bin/herdr-todo"
description = "TODO list (focus this space's TODO tab, else new tab)"

# Not a prefix chord: cmd+ctrl+r is the same key VS Code uses to come back here
# (~/bin/herdr-open-dir), so one chord toggles between editor and terminal.
[[keys.command]]
key = "cmd+ctrl+r"
type = "shell"
command = "~/bin/herdr-code"
description = "open this space's project root in VS Code (code -r)"

# Worktree picker, ported from tmux prefix g. The prefix+f picker scoped to the
# current repo; type = "pane" so the temp pane inherits the active pane's cwd
# (terminal.new_cwd defaults to "follow"), which is the repo it lists.
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "~/bin/herdr-worktree-picker"
description = "worktree picker (this repo, most recently opened first)"

# gwt worktree creation, ported from tmux prefix G.
[[keys.command]]
key = "prefix+shift+g"
type = "pane"
command = "~/bin/herdr-gwt-prompt"
description = "worktree switch (branch/#pr/url)"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/bin/herdr-navigate left"
description = "navigate left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/bin/herdr-navigate down"
description = "navigate down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/bin/herdr-navigate up"
description = "navigate up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/bin/herdr-navigate right"
description = "navigate right (vim-aware)"

[[keys.command]]
key = "prefix+("
type = "shell"
command = "~/bin/herdr-snap-split 0.36"
description = "snap split 36:64 (big right)"

[[keys.command]]
key = "prefix+)"
type = "shell"
command = "~/bin/herdr-snap-split 0.64"
description = "snap split 64:36 (big left)"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "~/bin/herdr-close-other-tabs"
description = "close other tabs in workspace (keep agent tabs)"

[[keys.command]]
key = "prefix+!"
type = "shell"
command = "~/bin/herdr-break-pane"
description = "break pane out into a new tab"

[[keys.command]]
key = "prefix+shift+j"
type = "pane"
command = "~/bin/herdr-join-pane"
description = "join a pane from another tab in this space (fzf picker)"

[[keys.command]]
key = "prefix+m"
type = "popup"
command = "~/bin/herdr-move-pane-to-worktree"
width = "70%"
height = "60%"
description = "move this pane to another worktree's space (most recently opened first)"

[[keys.command]]
key = "prefix+/"
type = "popup"
command = "~/bin/herdr-session-search"
width = "90%"
height = "85%"
description = "find a past Claude session by content (all repos + worktrees) and resume it"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "~/bin/herdr-close-idle-tabs"
description = "close idle tabs in workspace (no program running)"

[[keys.command]]
key = "prefix+="
type = "shell"
command = "~/bin/herdr-evenize"
description = "evenize all splits (equal panes)"

[theme]
name = "catppuccin"

[ui]
hide_tab_bar_when_single_tab = false
agent_panel_sort = "spaces"
confirm_close = false
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

status_indicators = "dots"

# Agent rows: the repo the agent works in (not the worktree), the branch, then
# what the session is working on.
[ui.sidebar.agents]
rows = [
  # $title is "<PR status emoji> <repo name>" and $branch " <checkout's branch>",
  # both reported on every pane by ~/bin/herdr-pr-status. $summary is a Haiku
  # one-liner from ~/bin/herdr-claude-summary, refreshed while the agent is idle.
  # The agents panel dims custom tokens by default, so pin readable colors.
  ["state_icon", { token = "$title", fg = "#cdd6f4", bold = true }],
  [{ token = "$branch", fg = "#7f849c", dim = false }],
  [{ token = "$summary", fg = "#7f849c", dim = false }],
]

# $main and $wt are "<PR status emoji> <label>", reported by ~/bin/herdr-pr-status.
# A space has exactly one: $main for a repo's main checkout, shown bright, and
# $wt for a linked worktree, shown dimmer so main checkouts stand out.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$main", fg = "#cdd6f4", bold = true }, { token = "$wt", fg = "#9399b2" }],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
